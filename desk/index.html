<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书桌 · 赖选</title>
<meta name="description" content="四个可点的地方：便利贴上是四个问题，笔记本上是在写的东西，书架上是在读的六本，电脑前是在用的工具。">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<style>
.desk {
  display: grid;
  grid-template-columns: minmax(0, 520px) minmax(0, 1fr);
  gap: 36px;
  align-items: start;
  margin-top: 34px;
}
@media (max-width: 900px) {
  .desk { grid-template-columns: 1fr; gap: 26px; }
}

.desk__stage { position: relative; line-height: 0; }
.desk__stage img { width: 100%; height: auto; display: block; }

.hot {
  position: absolute;
  background: transparent;
  border: 1px dotted rgba(10,10,11,.42);
  border-radius: 2px;
  cursor: pointer;
  padding: 0;
  font: inherit;
  transition: background .18s ease, border-color .18s ease;
}
.hot:hover { background: rgba(10,10,11,.06); border-color: rgba(10,10,11,.78); }
.hot[aria-pressed="true"] {
  border: 2px solid var(--ink);
  background: rgba(10,10,11,.045);
}
.hot__label {
  position: absolute;
  top: -1px; left: -1px;
  transform: translateY(-100%);
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .12em;
  line-height: 1.4;
  padding: 2px 6px;
  background: var(--paper);
  color: var(--ink-2);
  white-space: nowrap;
  border: 1px solid var(--rule);
  border-bottom: 0;
  transition: color .18s ease, background .18s ease;
}
.hot[aria-pressed="true"] .hot__label { background: var(--ink); color: var(--paper); border-color: var(--ink); }
/* 贴着右边缘的热点，标签往左长，免得跑出画外 */
.hot__label--end { left: auto; right: -1px; }

.desk__panel { min-height: 340px; }
@media (max-width: 900px) { .desk__panel { min-height: 0; } }
.desk__panel .p-k {
  font-family: var(--font-mono);
  font-size: .68rem;
  letter-spacing: .18em;
  color: var(--ink-2);
  text-transform: uppercase;
  display: block;
  margin-bottom: 8px;
}
.desk__panel h2 { font-size: 1.4rem; margin-bottom: .5em; }
.desk__panel ul { margin: 0 0 14px; padding: 0 0 0 1.1em; }
.desk__panel li { margin: 0 0 .35em; max-width: 26em; }
.desk__panel .p-b { font-size: .93rem; line-height: 1.75; color: var(--ink-2); max-width: 26em; margin: 0; }
.desk__panel .fadein { animation: swap .28s ease-out both; }
@keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.hint { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .1em; color: var(--ink-2); margin-top: 12px; }
</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div class="wrap">
  <header class="site-head">
    <a class="brand" href="../">赖选 · 展厅</a>
    <nav>
      <a href="https://github.com/peishenglai3-hash">主页</a>
      <a href="../desk/" aria-current="page">书桌</a>
      <a href="../sandbox/">沙盒</a>
      <a href="../field/">方法</a>
    </nav>
  </header>

  <main id="main">
    <div class="section cap-hide" style="padding-top:38px">
      <span class="mono">01 / 我是谁</span>
      <h1 style="margin-top:.35em">一张能点开的书桌</h1>
      <p class="lede">这张图不是我，是我读书时想让别人看见的样子。图上有四个地方可以点：便利贴、笔记本、书架、电脑。点哪个，右边就换——内容全部来自这张图上真实写着的东西，我没给它补台词。</p>
    </div>

    <div class="desk">
      <div class="desk__stage" id="stage">
        <img src="../assets/desk.webp" width="720" height="900" alt="图书馆里的书桌：左侧一摞社会学与 AI 相关的书，中间摊开的笔记本写着讨论提纲，右侧是贴满贴纸的笔记本电脑，右上方贴着黄色便利贴，前面有一杯咖啡。">

        <button class="hot" data-key="notes" aria-pressed="false" aria-controls="panel"
                style="left:84.4%;top:9.5%;width:15.1%;height:18.6%">
          <span class="hot__label hot__label--end">A · 便利贴</span>
        </button>

        <button class="hot" data-key="books" aria-pressed="false" aria-controls="panel"
                style="left:0;top:54.9%;width:30%;height:33%">
          <span class="hot__label">C · 书架</span>
        </button>

        <button class="hot" data-key="notebook" aria-pressed="false" aria-controls="panel"
                style="left:35.2%;top:66.7%;width:35%;height:26%">
          <span class="hot__label">B · 笔记本</span>
        </button>

        <button class="hot" data-key="desk" aria-pressed="false" aria-controls="panel"
                style="left:80.6%;top:53%;width:19.4%;height:35.5%">
          <span class="hot__label hot__label--end">D · 电脑</span>
        </button>
      </div>

      <div class="desk__panel" id="panel" role="region" aria-live="polite" aria-atomic="true">
        <!-- 由脚本填充 -->
      </div>
    </div>

    <p class="note cap-hide">书架那一段刻意只列书名。没读完的不列结论，是我给自己定的规矩，也是这一页最容易被人误读的地方：书架上摆着，不等于读透了。</p>
  </main>

  <footer class="site-foot">
    <span>赖选 · 2026</span>
    <span><a href="../">← 回展厅</a> · <a href="https://github.com/peishenglai3-hash">GitHub</a></span>
  </footer>
</div>

<script>
(function () {
  const DATA = {
    notes: {
      k: 'A · 便利贴',
      title: '贴在上面的四个问题',
      items: ['技术与权力', 'AI 的社会影响', '平等与正义？', '反思「理所当然」的权威'],
      body: '四个都还没有答案。写在便利贴上，是因为它们每天会以不同的样子回来一次。',
    },
    notebook: {
      k: 'B · 笔记本',
      title: '讨论提纲：正在写的东西',
      items: ['技术如何重塑社会关系', 'AI 的治理：效率、公平与权力', '权威的合理性与边界', '如何在现实中推进更平等、更自主的社会'],
      body: '提纲的意思是：还没想完。它比结论诚实，也比结论难写。',
    },
    books: {
      k: 'C · 书架',
      title: '六本在读',
      items: ['社会学导论（第三版）', '现代社会理论', '政治哲学：核心问题与经典文本', '权力与正当性', '人工智能：技术、社会与治理', 'AI与社会：机遇、风险与规则'],
      body: '只列书名，不列读后感。摆在桌上的是正在用的，不是已经消化的。',
    },
    desk: {
      k: 'D · 电脑',
      title: '在这台机器上干活',
      items: ['DeepSeek Harness', 'Chrome', 'ffmpeg'],
      body: '研究、写作、把图做出来，都在这三件上。工具可以换；换不掉的是「这段结论能不能被别人复算一遍」。',
    },
  };
  const ORDER = ['notes', 'notebook', 'books', 'desk'];

  const panel = document.getElementById('panel');
  const hots = [...document.querySelectorAll('.hot')];
  let active = null;

  function paint(key) {
    const d = DATA[key];
    active = key;
    hots.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.key === key)));
    panel.innerHTML =
      '<div class="fadein">' +
        '<span class="p-k">' + d.k + '</span>' +
        '<h2>' + d.title + '</h2>' +
        '<ul>' + d.items.map(t => '<li>' + t + '</li>').join('') + '</ul>' +
        '<p class="p-b">' + d.body + '</p>' +
      '</div>';
    panel.dataset.key = key;
  }

  hots.forEach(b => {
    b.addEventListener('click', () => paint(b.dataset.key));
  });

  // 窄屏点完自动滚到面板，不然点了没反应
  const narrow = window.matchMedia('(max-width: 900px)');
  hots.forEach(b => b.addEventListener('click', () => {
    if (narrow.matches) panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }));

  paint('notes');

  // 抓帧用：render(t) 把页面推到确定状态；不调用时页面完全手动
  let raf = null;
  window.__apt = {
    keys: ORDER,
    render(t) {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      const i = Math.floor((t / 2100) % ORDER.length);
      if (ORDER[i] !== active) paint(ORDER[i]);
    },
    state: () => ({ active, panelHeight: panel.getBoundingClientRect().height }),
    stop() {},
  };
})();
</script>
</body>
</html>
